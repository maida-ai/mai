name: S3 warm validator experiment
run-name: S3 evidence (${{ inputs.platform }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native runner platform (all starts three jobs)
        type: choice
        required: true
        default: linux
        options:
          - linux
          - macos
          - windows
          - all

permissions:
  contents: read

jobs:
  s3:
    uses: ./.github/workflows/evidence-experiment-runner.yml
    with:
      experiment: s3
      platform: ${{ inputs.platform }}
