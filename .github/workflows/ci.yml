name: Rust correctness
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Keep synthetic fixture bytes independent of runner Git checkout defaults.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked --bins
      - name: POSIX demo
        if: runner.os != 'Windows'
        run: bash examples/demo.sh
      - name: Windows demo
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./examples/demo.ps1
      - name: CLI benchmark smoke test
        run: cargo run --release --locked --bin mai-bench -- --agents 16 --workers 8 --hotspot-agents 4 --cli target/release/mai${{ runner.os == 'Windows' && '.exe' || '' }}
