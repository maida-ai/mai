name: Product validator ecosystem evidence
run-name: Product ecosystem evidence (${{ inputs.platform }}) by @${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to measure (all starts three jobs)
        required: true
        type: choice
        default: linux
        options: [linux, macos, windows, all]
permissions:
  contents: read
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install experiment tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.6.17
          npm install --global yarn@1.22.22
      - name: Build product
        run: cargo build --locked
      - name: Measure real product commands
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          python experiments/product-validation/run.py "$RUNNER_TEMP/product-validation" --mai "target/debug/mai$suffix"
      - name: Collect bounded evidence including failures
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/product-validation" ]]; then
            python experiments/product-validation/collect.py "$RUNNER_TEMP/product-validation" "$RUNNER_TEMP/product-validation-evidence"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: product-validator-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-validation-evidence/
          retention-days: 14
          if-no-files-found: warn
