[package]
name = "mai"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Agent-native centralized version control with Git-backed storage"
license = "Apache-2.0"
readme = "README.md"
default-run = "mai"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
