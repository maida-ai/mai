[package]
name = "mai"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Agent-native centralized version control with Git-backed storage"
license = "Apache-2.0"
readme = "README.md"
default-run = "mai"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[[bin]]
name = "mai-bench"
path = "benchmarks/fanout.rs"
